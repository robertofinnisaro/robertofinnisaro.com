[include moonraker_obico_macros.cfg]

# If you prefer a direct serial connection, in "make menuconfig"
# select "Enable extra low-level configuration options" and select
# serial (on USART3 PB11/PB10), which is broken out on the 10 pin IDC
# cable used for the LCD module as follows:
# 3: Tx, 4: Rx, 9: GND, 10: VCC

# Flash this firmware by copying "out/klipper.bin" to a SD card and
# turning on the printer with the card inserted. The firmware
# filename must end in ".bin" and must not match the last filename
# that was flashed.

# See docs/Config_Reference.md for a description of parameters.

[include mainsail.cfg]
[include macro.cfg]
[include timelapse.cfg]
#[include KlackEnder.cfg]
#[include klack-probe.cfg]
[include stealthburner_leds.cfg]

# Enable object exclusion
[exclude_object]

# Enable arcs support
[gcode_arcs]
resolution: 0.1

[stepper_x]
step_pin: PB13
dir_pin: PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC0
position_endstop: 0
position_min: 0
position_max: 225
homing_speed: 80

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 1.0
# stealthchop_threshold: 999999
stealthchop_threshold: 0

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
full_steps_per_rotation: 200
endstop_pin: ^PC1
position_endstop: 225
position_min: -2
position_max: 225
homing_speed: 80

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 1.0
#stealthchop_threshold: 999999
stealthchop_threshold: 0

[stepper_z]
step_pin: PB0
dir_pin: !PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
full_steps_per_rotation: 200
# endstop_pin: ^PC2
endstop_pin: probe: z_virtual_endstop
# position_endstop: 0
position_min: -1
position_max: 240

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.650
stealthchop_threshold: 999999

[probe]
pin: ^!PC15
x_offset: 0
y_offset: 22.6
#z_offset: 0

speed: 5.0
samples: 3
samples_result: median
sample_retract_dist: 2.0

[extruder]
step_pin: PB3
dir_pin: PB4
enable_pin: !PD1
microsteps: 32
full_steps_per_rotation: 200
rotation_distance: 21.84
gear_ratio: 50:10
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PA0
min_temp: 0
max_temp: 500
max_extrude_only_distance: 400
max_extrude_only_velocity: 120

[tmc2209 extruder]
interpolate: true
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.85
sense_resistor: 0.11 
#stealthchop_threshold: 999999
driver_TBL: 0
driver_HEND: 6
driver_HSTRT: 7
driver_TOFF: 4

[heater_bed]
heater_pin: PC9
sensor_type: ATC Semitec 104GT-2
sensor_pin: PC4
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
min_temp: 0
max_temp: 130

[heater_fan heatbreak_cooling_fan]
pin: PC7

[heater_fan controller_fan]
pin: PB15

[fan]
pin: PC6

[mcu]
serial: /dev/serial/by-id/<mcu-serial-removed>
baud: 250000

[printer]
kinematics: corexy
max_velocity: 400
max_accel: 4000
max_z_velocity: 10
max_z_accel: 100
square_corner_velocity: 5.0

[temperature_sensor raspberry_pi]

    sensor_type: temperature_host
    min_temp: 10
    max_temp: 100

[temperature_sensor mcu_temp]
    sensor_type: temperature_mcu
    min_temp: 0
    max_temp: 100

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

[homing_override]
set_position_z: 0
gcode:
    G0 Z5
    G28 Y
    G28 X
    G0 X120 Y150 F3000
    G28 Z

[bed_screws]
screw1: 37, 33
screw2: 207, 33
screw3: 207, 205
screw4: 37, 205

[include AFC/*.cfg]

