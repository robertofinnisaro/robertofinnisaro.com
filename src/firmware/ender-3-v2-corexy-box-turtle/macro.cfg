[gcode_macro PRINT_START]
gcode:
  STATUS_HEATING
  # Get Bed and Extruder temperature from Slicer GCode
  {% set BED_TEMP = params.BED|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER|default(195)|float %}
  {% set S_EXTRUDER_TEMP = 150|float %}
  {% set initial_tool = params.TOOL|default("0")|int %}

  G90 ; use absolute coordinates
  M83 ; extruder relative mode

  G28
  AFC_PARK

  M140 S{BED_TEMP} # Set bed temp
  M109 S{EXTRUDER_TEMP} # wait for extruder temp
  T{initial_tool} #Load Initial Tool

  M104 S{S_EXTRUDER_TEMP} # set standby extruder temp
  M190 S{BED_TEMP} # wait for bed temp

  STATUS_HOMING
  G28 Z

  AFC_PARK
  M109 S{EXTRUDER_TEMP} ; wait for extruder temp

  STATUS_PRINTING

  # Add any pre print prime/purge line here
  ; Move to purge start position
  G1 X20 Y5 F3000                       ; Front-left corner
  G1 Z0.3 F1000                         ; Lower to bed level
  G92 E0                                ; Zero extruder
  
  ; Purge line 1
  G1 X100 E15 F1000                     ; Extrude purge line
  G1 E13 F1000                          ; Retract 2mm to prevent drool
  G92 E0                                ; Reset extruder again
  
  ; Move to second line without extrusion
  G1 Z0.6 F1000                         ; Lift to prevent dragging
  G1 X20 Y10 F3000                      ; Move to second purge line start
  G1 Z0.3 F1000                         ; Lower again
  G92 E0                                ; Reset once more
  
  ; Purge line 2
  G1 X100 E15 F1000                     ; Second purge line
  G92 E0                                ; Final reset before print

  ; Ready to print
  G1 Z0.2 F1000                         ; Final print height
  G1 X20 Y10 F3000                      ; First layer start
  M117 Printing...
  # Start Print
  
  # ; Start G-code for CoreXY Ender 3 V2 (Z homes at top)
  # M117 Starting Print...
  
  # ; Reset positions
  # G92 E0                                ; Reset extruder position
  # M140 S{BED_TEMP} ; Set bed temp (no wait)
  # M104 S{EXTRUDER_TEMP} ; Set nozzle temp (no wait)
  
  # G28                                   ; Home all axes (Z homes at top)
  
  # ; Lower nozzle to safe height above bed
  # G1 Z10 F1000                          ; Move Z down 10mm from top (safe travel height)
  
  # ; Wait for heating
  # M190 S{BED_TEMP} ; Wait for bed to reach temp
  # M109 S{EXTRUDER_TEMP} ; Wait for nozzle to reach temp
  
  # ; Move to purge start position
  # G1 X10 Y5 F3000                       ; Front-left corner
  # G1 Z0.3 F1000                         ; Lower to bed level
  # G92 E0                                ; Zero extruder
  
  # ; Purge line 1
  # G1 X100 E15 F1000                     ; Extrude purge line
  # G1 E13 F1000                          ; Retract 2mm to prevent drool
  # G92 E0                                ; Reset extruder again
  
  # ; Move to second line without extrusion
  # G1 Z0.6 F1000                         ; Lift to prevent dragging
  # G1 X10 Y10 F3000                      ; Move to second purge line start
  # G1 Z0.3 F1000                         ; Lower again
  # G92 E0                                ; Reset once more
  
  # ; Purge line 2
  # G1 X100 E15 F1000                     ; Second purge line
  # G92 E0                                ; Final reset before print
  
  # ; Ready to print
  # G1 Z0.2 F1000                         ; Final print height
  # G1 X10 Y10 F3000                      ; First layer start
  # M117 Printing...

#       # Get Printer built volume dimensions
#       {% set X_MAX = printer.toolhead.axis_maximum.x|default(220)|float %}
#       {% set Y_MAX = printer.toolhead.axis_maximum.y|default(220)|float %}
#       {% set Z_MAX = printer.toolhead.axis_maximum.z|default(250)|float %}

#       # Get Nozzle diameter and filament width for conditioning
#       {% set NOZZLE = printer.extruder.nozzle_diameter|default(0.4)|float %}
#       {% set FILADIA = printer.extruder.filament_diameter|default(1.75)|float %}

#       # Set Start coordinates of priming lines
#       {% set X_START = 10.0|default(10.0)|float %}
#       {% set Y_START = 10.0|default(20.0)|float %}

#       # Calculate Primer line extrusion volume and filament length
#       {% set PRIMER_WIDTH = 0.6 * NOZZLE %}   # Smaller width for purge line
#       {% set PRIMER_HEIGHT = 0.5 * NOZZLE %}  # Smaller height for purge line
#       {% set PRIMER_SECT = PRIMER_WIDTH * PRIMER_HEIGHT %}
#       {% set PRIMER_VOL = PRIMER_SECT * (X_MAX - 2 * X_START) %}
#       {% set FILA_SECT = 3.1415 * ( FILADIA / 2.0)**2 %}
#       {% set FILA_LENGTH = 1.55 * PRIMER_VOL / FILA_SECT %}

#       # Get Bed and Extruder temperature from Slicer GCode
#       {% set BED_TEMP = params.BED|default(50)|float %}
#       {% set EXTRUDER_TEMP = params.HOTEND|default(235)|float %}

#       # Preheat nozzle and bed
#       M104 S{EXTRUDER_TEMP} T0
#       M140 S{BED_TEMP}

#       # Home
#       G28

#       # Move up to clean bed
#       G1 Y{Y_MAX - 20} Z{Z_MAX / 4.0} F6000

#       # Heat nozzle and bed
#       M190 S{BED_TEMP}
#       M109 S{EXTRUDER_TEMP} T0

#       # Auto Leveling
#       BED_MESH_CALIBRATE
#       BED_MESH_PROFILE LOAD=default

#       # Precondition extruder
#       G92 E0     
#       G1 X{X_START} Y{Y_START} Z{PRIMER_HEIGHT} F6000.0     
      
#       # Smaller purge line: Extrude just enough to prime the nozzle
#       G1 X{X_START + 30} Y{Y_START} Z{PRIMER_HEIGHT} E5 F1000.0  # Shorter purge line with less extrusion
#       G1 X{X_START + 30} Y{Y_START + PRIMER_WIDTH} Z{PRIMER_HEIGHT}  # Move to next line
#       G1 X{X_START} Y{Y_START + PRIMER_WIDTH} Z{PRIMER_HEIGHT} E5 F1000.0  # Complete the small purge line

#       G92 E0  # Reset extruder position after purge
#       G1 Z2.0 F600  # Lift the nozzle
#       G1 Z0.2 F600  # Move to the starting layer height
#       G1 Z2.0 F600  # Move up to start the print




[gcode_macro END_PRINT]
gcode:
        #Get Printer built volume dimensions
        {% set X_MAX = printer.toolhead.axis_maximum.x|default(220)|float %}
        {% set Y_MAX = printer.toolhead.axis_maximum.y|default(220)|float %}

        #Fix-up extruder
        G91                                            
        G1 E-2 F2700                                    
        G1 E-1.5 Z0.2 F2400                        
        G1 X5 Y5 F6000                               
        G1 Z10                                     
        G90                                        

        #Present print
        G1 Z{printer.toolhead.position.z + 10} F600
        G1 X{20} Y{220} F6000
        M106 S0                                      
        M104 S0                                       
        M140 S0                                 

        #Disable Steppers
        M84 X Y E   

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # Parameters
    {% set z = params.Z|default(10)|int %}                                                   ; z hop amount

    {% if printer['pause_resume'].is_paused|int == 0 %}
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE={z}                              ; set z hop variable for reference in resume macro
        SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=etemp VALUE={printer['extruder'].target}    ; set hotend temp variable for reference in resume macro

        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=0                                  ; disable filament sensor
        SAVE_GCODE_STATE NAME=PAUSE                                                          ; save current print position for resume
        BASE_PAUSE                                                                           ; pause print
        {% if (printer.gcode_move.position.z + z) < printer.toolhead.axis_maximum.z %}       ; check that zhop doesn't exceed z max
            G91                                                                              ; relative positioning
            G1 Z{z} F900                                                                     ; raise Z up by z hop amount
        {% else %}
            { action_respond_info("Pause zhop exceeds maximum Z height.") }                  ; if z max is exceeded, show message and set zhop value for resume to 0
            SET_GCODE_VARIABLE MACRO=RESUME VARIABLE=zhop VALUE=0
        {% endif %}
        G90                                                                                  ; absolute positioning
        G1 X{20} Y{220} F6000   ; park toolhead at front center
        SAVE_GCODE_STATE NAME=PAUSEPARK                                                      ; save parked position in case toolhead is moved during the pause (otherwise the return zhop can error)
        SET_IDLE_TIMEOUT TIMEOUT=43200                                                       ; set timeout to 12 hours
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
variable_zhop: 0
variable_etemp: 0
gcode:
    # Parameters
    {% set e = params.E|default(2.5)|int %}                                          ; hotend prime amount (in mm)

    # {% if printer['pause_resume'].is_paused|int == 1 %}
        SET_FILAMENT_SENSOR SENSOR=filament_sensor ENABLE=1                          ; enable filament sensor
        #INITIAL_RGB                                                                    ; reset LCD color
        SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}  ; set timeout back to configured value
        {% if etemp > 0 %}
            M109 S{etemp|int}                                                        ; wait for hotend to heat back up
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSEPARK MOVE=1 MOVE_SPEED=100                     ; go back to parked position in case toolhead was moved during pause (otherwise the return zhop can error)
        G91                                                                          ; relative positioning
        M83                                                                          ; relative extruder positioning
        {% if printer[printer.toolhead.extruder].temperature >= printer.configfile.settings.extruder.min_extrude_temp %}
            G1 Z{zhop * -1} E{e} F900                                                ; prime nozzle by E, lower Z back down
        {% else %}
            G1 Z{zhop * -1} F900                                                     ; lower Z back down without priming (just in case we are testing the macro with cold hotend)
        {% endif %}
        RESTORE_GCODE_STATE NAME=PAUSE MOVE=1 MOVE_SPEED=60                          ; restore position
        BASE_RESUME                                                                  ; resume print
    # {% endif %}


[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    # Retract
    G91
    G1 E-2 F2700
    G1 10 F1200
    G90

    # Park
    G1 X20 Y220 F6000

    TURN_OFF_HEATERS

    M107

    CLEAR_PAUSE

    SDCARD_RESET_FILE

    BASE_CANCEL_PRINT
    
[gcode_macro AFC_ERROR]
description: Recoerable AFC failure
gcode:
    RESPOND TYPE=error MSG="AFC intervention required"
    PAUSE
    G91
    G1 Z10 F600
    G90
    G1 X20 Y220 F6000
    SET_IDLE_TIMEOUT TIMEOUT=43200

[gcode_macro mesh_leveling]
gcode:
    # Set extruder and bed temperature
    M190 S60
    M109 T0 S120
    # Home all axis
    G28
    G29
    # Start probing
    BED_MESH_CALIBRATE PRODILE=mesh1 METHOD=automatic
    # Turn off heaters
    TURN_OFF_HEATERS

[gcode_macro mesh_save]
gcode:
    BED_MESH_PROFILE SAVE=mesh1
    SAVE_CONFIG

[gcode_macro FILAMENT_UNLOAD]
gcode:
    G28                    ; Home all axes
    G1 X117.5 Y116 F15000
    G1 Z100 F3000          ; Move the Z-axis to 200mm
    M109 S{225} T0         ; Set the hotend temperature and wait for it to reach
    M190 S{60}             ; Wait for the bed temperature to reach 60°C
    M83                    ; Set extruder to relative mode
    G92 E0.0               ; Reset the extruder position
    G1 E10 F350            ; Purge 10mm of filament to clear the nozzle
    G1 E-100 F350          ; Retract 100mm to remove filament from the hotend
    G92 E0.0               ; Reset extruder position again
    M82                    ; Set extruder back to absolute mode

[gcode_macro FILAMENT_LOAD]
gcode:    
    G28                    ; Home all axes
    G1 X117.5 Y116 F15000
    G1 Z100 F3000          ; Move the Z-axis to 200mm
    M190 S{60}             ; Wait for the bed temperature to reach 60°C
    M109 S{225} T0         ; Wait for the hotend temperature to reach 225°C
    M83                    ; Set extruder to relative mode
    G92 E0.0               ; Reset the extruder position
    G1 E100 F350           ; Extrude 100mm of filament to load it into the hotend
    G92 E0.0               ; Reset extruder position again after loading filament
    G1 E40 F350            ; Purge 40mm of filament to clear the nozzle and ensure good flow
    G92 E0.0               ; Reset extruder position again after purging
    M82                    ; Set extruder back to absolute mode

[gcode_macro FILAMENT_CHANGE]
gcode:
  FILAMENT_UNLOAD
  FILAMENT_LOAD

[gcode_macro SET_ACTIVE_SPOOL]
gcode:
  {% if params.ID %}
    {% set id = params.ID|int %}
    {action_call_remote_method(
      "spoolman_set_active_spool",
      spool_id=id
    )}
  {% else %}
    {action_respond_info("Parameter 'ID' is required")}
  {% endif %}

[gcode_macro CLEAR_ACTIVE_SPOOL]
gcode:
  {action_call_remote_method(
    "spoolman_set_active_spool",
    spool_id=None
  )}

